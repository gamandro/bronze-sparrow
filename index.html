const form=document.getElementById("unlock-form"),input=document.getElementById("password"),button=document.getElementById("unlock"),error=document.getElementById("error");
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
form.addEventListener("submit",async event=>{
  event.preventDefault();error.textContent="";button.disabled=true;button.textContent="正在解锁…";
  try{
    if(!globalThis.crypto?.subtle)throw new Error("UNSUPPORTED");
    const material=await crypto.subtle.importKey("raw",new TextEncoder().encode(input.value),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:bytes(DATA.salt),iterations:DATA.iterations,hash:"SHA-256"},material,{name:"AES-GCM",length:256},false,["decrypt"]);
    const clear=await crypto.subtle.decrypt({name:"AES-GCM",iv:bytes(DATA.iv),tagLength:128},key,bytes(DATA.payload));
    input.value="";
    document.open();document.write(new TextDecoder().decode(clear));document.close();
  }catch(reason){
    error.textContent=reason?.message==="UNSUPPORTED"?"此浏览器不支持 Web Crypto API；请使用最新版 Safari、Chrome、Edge 或 Firefox，并通过 HTTPS 访问。":"密码错误，或加密文件已经损坏。";
    input.select();
  }finally{button.disabled=false;button.textContent="解锁行程"}
});
